      <span style="display: flex; align-items: center; gap: 6px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #8E8C88;"><span style="width: 8px; height: 8px; border-radius: 4px; background: #4C8FE8;"></span>You can speak now</span>

  <div style="flex-grow: 1; padding: 18px 22px 30px; display: flex; flex-direction: column;">

      <span style="font-size: 26px; line-height: 1.18; font-weight: 700; letter-spacing: -0.02em;">Chào bạn, phòng bao nhiêu một đêm?</span>
      <span style="font-size: 14px; color: #5D5A55;">Hi, how much is the room per night?</span>
    </div>

    <div style="margin-top: auto; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px;">
      <button type="button" style="height: 56px; border: 1px solid #141414; border-radius: 14px; background: transparent; color: #141414; font: 600 16px 'Space Grotesk', sans-serif;">Kết nối board</button>
      <button type="button" style="height: 56px; border: none; border-radius: 14px; background: #141414; color: #EBE8E2; font: 600 16px 'Space Grotesk', sans-serif;">Dừng</button>

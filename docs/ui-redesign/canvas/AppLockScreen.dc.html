<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Màn khoá và Live Activity</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1A5DB8}a:hover{color:#123F7D}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; border-radius: 52px; background: #1A1918; color: #EBE8E2; font-family: 'Space Grotesk', system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 14px 12px 34px; overflow: hidden;">

  <div style="height: 37px; width: 214px; box-sizing: border-box; padding: 0 14px; border-radius: 19px; background: #000000; display: flex; align-items: center; justify-content: space-between;" aria-label="Dynamic Island: đang dịch EN sang VI">
    <span style="display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500;"><span style="width: 8px; height: 8px; border-radius: 4px; background: #4C8FE8;"></span>EN→VI</span>
    <span style="width: 18px; height: 18px; border-radius: 50%; border: 2px solid #1E6FD9; box-sizing: border-box;" aria-hidden="true"></span>
  </div>

  <div style="margin-top: 60px; display: flex; flex-direction: column; align-items: center; gap: 4px;">
    <span style="font-family: 'Space Grotesk', sans-serif; font-size: 13px; color: #B9B5AE;">Thứ Bảy, 15 tháng 11</span>
    <span style="font-size: 92px; font-weight: 500; line-height: 1; letter-spacing: -0.04em;">14:21</span>
  </div>

  <div style="margin-top: auto; width: 100%; box-sizing: border-box; padding: 16px; border-radius: 24px; background: #EBE8E2; color: #141414; display: flex; flex-direction: column; gap: 14px;">
    <div style="display: flex; align-items: center; justify-content: space-between; font-size: 14px; font-weight: 500;">
      <span style="display: flex; align-items: center; gap: 6px;"><span style="width: 8px; height: 8px; border-radius: 4px; background: #1E6FD9;"></span>Đang dịch tiếng Anh</span>
      <span style="color: #5D5A55;">Board 88%</span>
    </div>
    <div style="display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 12px; align-items: center;">
      <div style="width: 54px; height: 54px; border-radius: 50%; background: #0D0D0E; position: relative;" aria-hidden="true">
        <div style="position: absolute; inset: 0; border-radius: 50%; background-image: radial-gradient(#2A2A2E 1px, transparent 1.2px); background-size: 6px 6px;"></div>
        <div style="position: absolute; inset: 2px; border-radius: 50%; border: 2px solid #1E6FD9;"></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 3px;">
        <span style="font-size: 13px; color: #5D5A55;">Can I pay by card at Ben Thanh?</span>
        <span style="font-size: 17px; line-height: 1.3; font-weight: 700;">Tôi trả bằng thẻ ở Bến Thành được không?</span>
      </div>
    </div>
    <div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px;">
      <button type="button" style="height: 46px; border: 1px solid #141414; border-radius: 12px; background: transparent; color: #141414; font: 600 16px 'Space Grotesk', sans-serif;">Tắt mic board</button>
      <button type="button" style="height: 46px; border: none; border-radius: 12px; background: #141414; color: #EBE8E2; font: 600 16px 'Space Grotesk', sans-serif;">Dừng</button>
    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>

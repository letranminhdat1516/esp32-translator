name: ESPTranslator
options:
  bundleIdPrefix: dev.personal
  deploymentTarget:
    iOS: "26.0"
targets:
  ESPTranslator:
    type: application
    platform: iOS
    sources:
      - Sources
      # Loaded at run time (SharedResources / Copy): folder references keep
      # the languages/, board_glyphs/ and copy/ directories in the bundle
      - {path: ../shared/languages, type: folder, buildPhase: resources}
      - {path: ../shared/board_glyphs, type: folder, buildPhase: resources}
      - {path: ../shared/copy, type: folder, buildPhase: resources}
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Live Translator
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio, bluetooth-central]
        NSMicrophoneUsageDescription: Listens to you through your AirPods to translate into English.
        NSSpeechRecognitionUsageDescription: Recognizes speech on device for translation.
        NSBluetoothAlwaysUsageDescription: Connects to the ESP32 display to receive audio and show subtitles.
        NSSupportsLiveActivities: true
        # Variable fonts (OFL), registered at launch by the system: no font work on the first frame
        UIAppFonts: [SpaceGrotesk.ttf, JetBrainsMono.ttf]
    dependencies:
      - target: ESPTranslatorWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.cicca.esptranslator
        DEVELOPMENT_TEAM: G79B3VPVR9  # replace with your own team ID
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"

  # Live Activity + Dynamic Island. Shares Sources/Shared (attributes, intents, views) and the copy with the app.
  ESPTranslatorWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Sources/Shared
      - Sources/UI/Copy.swift
      - Sources/Resources/Fonts
      - {path: ../shared/copy, type: folder, buildPhase: resources}
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Live Translator
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts: [SpaceGrotesk.ttf, JetBrainsMono.ttf]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.cicca.esptranslator.widgets
        DEVELOPMENT_TEAM: G79B3VPVR9  # replace with your own team ID
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: YES

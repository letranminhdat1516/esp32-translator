name: ESPTranslator
options:
  bundleIdPrefix: dev.personal
  deploymentTarget:
    iOS: "26.0"
packages:
  ClaudeRelay:
    path: ../relay
targets:
  ESPTranslator:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies: [{ package: ClaudeRelay }]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Live Translator
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio, bluetooth-central]
        NSMicrophoneUsageDescription: Listens to you through your AirPods to translate into English.
        NSSpeechRecognitionUsageDescription: Recognizes speech on device for translation.
        NSBluetoothAlwaysUsageDescription: Connects to the ESP32 display to receive audio and show subtitles.
        NSCameraUsageDescription: Scans the pairing QR code that claude-board prints on your Mac.
        NSLocalNetworkUsageDescription: Reaches your Mac over Tailscale to relay Claude Code requests to the board.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.cicca.esptranslator
        DEVELOPMENT_TEAM: G79B3VPVR9  # replace with your own team ID
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
